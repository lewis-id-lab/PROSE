# Publishes the rendered site in docs/ to GitHub Pages. Render locally (`quarto render`) and commit docs/ and _freeze/ first.
#
# GitHub Pages is not available for private repositories on the free plan, so the job only runs when the repository is public.
# To go live: make the repository public, then enable Pages once with
#   gh api -X POST repos/lewis-id-lab/PROSE/pages -f build_type=workflow
# (or Settings, Pages, Source: GitHub Actions).
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
